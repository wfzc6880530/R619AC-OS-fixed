name: Build OpenWrt for P&W R619AC 128M

# 触发方式：
#   1) 手动: Actions 页面 -> 左侧 Build OpenWrt for P&W R619AC 128M -> Run workflow
#   2) 自动: push 到 main/master 且改动涉及 .config / workflow / 自定义文件时
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.config'
      - '.github/workflows/**'
      - 'patches/**'
      - 'files/**'
      - 'diy/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget bzip2 cpio \
            python3 python3-pip python3-ply subversion patch

      - name: 拉取 OpenWrt 25.12 稳定版源码
        run: |
          git clone --depth 1 -b openwrt-25.12 \
            https://github.com/openwrt/openwrt.git openwrt

      - name: 添加第三方软件源（PassWall / SSR-Plus / NPC）
        working-directory: openwrt
        run: |
          cat >> feeds.conf.default <<'EOF'
          src-git small https://github.com/kenzok8/small.git
          src-git npsow https://github.com/djylb/nps-openwrt.git
          EOF

      - name: 导入设备配置
        run: cp .config openwrt/.config

      - name: 更新并安装 feeds（软件包源）
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成完整配置
        working-directory: openwrt
        run: make defconfig

      - name: 预下载所有源码包（失败自动降级重试一次）
        working-directory: openwrt
        run: |
          make download -j$(nproc) || make download -j1 V=s

      - name: 开始编译固件
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s

      - name: 列出固件产物
        working-directory: openwrt
        run: ls -lh bin/targets/ipq40xx/generic/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-r619ac-128m
          path: |
            openwrt/bin/targets/ipq40xx/generic/*
          if-no-files-found: error
#（注：内容由AI生成）
